services:
  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    ports:
      - 3100:3100
    volumes:
      - ./loki.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vnet

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    volumes:
      - ./promptail.yaml:/etc/promtail/docker-config.yaml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/docker-config.yaml
    restart: unless-stopped
    networks:
      - vnet

  grafana:
    image: grafana/grafana-oss
    container_name: grafana
    ports:
      - 3000:3000
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    restart: unless-stopped
    networks:
      - vnet

  avagen:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: avagen
    env_file: ./.env
    command: >
      bash -c "
      ray start --head --dashboard-host=0.0.0.0 &&
      serve run ray_serve_config.yaml"
    restart: unless-stopped
    labels:
      - "logging=promtail"
    ports:
      - 8091:8091
      - 8625:8625
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    networks:
      - vnet
    volumes:
      - ./checkpoints:/module/checkpoints
      - ./gfpgan:/module/gfpgan
  
  redis:
    image: redis:7.2-rc-bullseye
    ports:
      - "6381:6379"
    container_name: redis
    command: redis-server --appendonly yes
    restart: unless-stopped
    labels:
      - "logging=promtail"
    networks:
      - vnet
  
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    ports:
      - "9002:9000"
      - "9001:9001"
    volumes:
      - minio:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    networks:
      - vnet
    labels:
      - "logging=promtail"
    command: server /data --console-address ":9001"
  
  t2v-transformers:
    image: cr.weaviate.io/semitechnologies/transformers-inference:sentence-transformers-paraphrase-multilingual-MiniLM-L12-v2
    container_name: t2v-transformers
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      ENABLE_CUDA: 1
    runtime: nvidia
    labels:
      - "logging=promtail"
    networks:
      - vnet
  
  weaviate:
    command:
      - --host
      - 0.0.0.0
      - --port
      - '8060'
      - --scheme
      - http
    image: cr.weaviate.io/semitechnologies/weaviate:1.31.2
    container_name: weaviate
    hostname: weaviate
    ports:
      - 8060:8060
      - 50051:50051
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: on-failure:0
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      ENABLE_API_BASED_MODULES: 'true'
      RAFT_ENABLE_ONE_NODE_RECOVERY: 'true'
      ENABLE_MODULES: text2vec-transformers
      TRANSFORMERS_INFERENCE_API: http://t2v-transformers:8080
      AUTOSCHEMA_ENABLED: 'false'
      CLUSTER_HOSTNAME: node1
    labels:
      - "logging=promtail"
    networks:
      - vnet

networks:
  vnet:

volumes:
  grafana-data:
  minio:
  weaviate_data: